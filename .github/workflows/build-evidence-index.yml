name: Build evidence index

on:
  schedule:
    # 05:17 UTC daily — quiet hour for the parliament API.
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      quarter:
        description: 'Build a quarterly archive (e.g. 2025-Q4). Leave blank for the rolling 90-day index.'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git for automated commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      # Self-healing quarterly seal. Every scheduled run scans the last
      # three complete quarters; if any is past its 5-day grace period
      # and doesn't have a corresponding evidence-YYYY-QN.json in the
      # repo, this seals it as its own commit. Idempotent: skips
      # quarters that already have a file. Skipped when the run has
      # inputs.quarter set — that's a manual seal handled below.
      - name: Seal any missing quarterly archives
        if: inputs.quarter == ''
        run: |
          python3 <<'PY'
          import subprocess, sys
          from datetime import date, timedelta
          from pathlib import Path

          REPO = Path.cwd()
          GRACE_DAYS = 5
          LOOKBACK_QUARTERS = 3

          today = date.today()
          current_q = (today.month - 1) // 3 + 1
          current_y = today.year

          for offset in range(1, LOOKBACK_QUARTERS + 1):
              q, y = current_q - offset, current_y
              while q <= 0:
                  q += 4
                  y -= 1
              # Q1 ends Mar 31, Q2 ends Jun 30, Q3 ends Sep 30, Q4 ends Dec 31
              end_month = q * 3
              end_day = 31 if end_month in (3, 12) else 30
              seal_after = date(y, end_month, end_day) + timedelta(days=GRACE_DAYS)
              if today < seal_after:
                  print(f"Q{q} {y}: still within grace period (seal on {seal_after}) — skip")
                  continue
              fname = REPO / f"evidence-{y}-Q{q}.json"
              if fname.exists():
                  print(f"{y}-Q{q}: already sealed at {fname.name} — skip")
                  continue
              qid = f"{y}-Q{q}"
              print(f"::group::Sealing {qid}")
              subprocess.check_call([sys.executable, "tools/build-evidence-index.py", "--quarter", qid])
              subprocess.check_call(["git", "add", str(fname.name), "evidence-archives.json"])
              subprocess.check_call(["git", "commit", "-m", f"Build quarterly archive {qid}"])
              subprocess.check_call(["git", "push"])
              print("::endgroup::")
          PY

      - name: Build the index
        run: |
          if [ -n "${{ inputs.quarter }}" ]; then
            python3 tools/build-evidence-index.py --quarter "${{ inputs.quarter }}"
          else
            python3 tools/build-evidence-index.py
          fi

      - name: Commit if changed
        run: |
          git add evidence-index.json evidence-*-Q*.json evidence-archives.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          if [ -n "${{ inputs.quarter }}" ]; then
            # Quarterly archives are rare, deliberate milestones — keep
            # them in the history as normal commits.
            git commit -m "Build quarterly archive ${{ inputs.quarter }}"
            git push
          else
            # Rolling index rebuilds daily and the per-day commit history
            # is noise that nobody ever looks at. Amend onto a single
            # auto-commit at the tip so the pack doesn't grow ~1.5 MB
            # every day forever. The moment a human commit lands, the
            # next rebuild starts a fresh auto-commit on top of it,
            # which is then amended in place by the runs after that.
            AUTO_MSG='Rolling evidence index (auto)'
            if [ "$(git log -1 --pretty=%s)" = "$AUTO_MSG" ]; then
              git commit --amend --no-edit
              git push --force-with-lease
            else
              git commit -m "$AUTO_MSG"
              git push
            fi
          fi
